name: Node CI

on: push

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-24.04

    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Set up Node.js 24
        uses: actions/setup-node@249970729cb0ef3589644e2896645e5dc5ba9c38 # v6.5.0
        with:
          node-version: 24
      - name: Standardize npm
        run: npm install --global npm@12
      - name: Verify Node/npm toolchain
        shell: bash
        run: |
          echo "Node: $(node --version)"
          echo "npm:  $(npm --version)"
          test "$(node --version | cut -d. -f1 | tr -d v)" = "24"
          test "$(npm --version | cut -d. -f1)" = "12"
      - name: Install dependencies
        run: npm ci
      - name: Check formatting
        run: npm run format:check
      - name: Test
        run: npm test
      - name: Build
        run: npm run build
      - name: Check dist/ is up to date
        shell: bash
        run: |
          if [ -n "$(git status --porcelain -- dist)" ]; then
            git status --short -- dist
            echo "::error::dist/ does not match a fresh build. Run npm run build and commit dist/."
            exit 1
          fi
